name: Fix Poetry Lock File

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main # Or whichever branch you want this to run on

jobs:
  fix-lock:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Specify your desired Python version

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest # Or a specific version, e.g., '1.8.2'
        
    - name: Run poetry lock --no-update to fix lock file
      run: poetry lock --no-update

    - name: Commit and Push changes (optional)
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Fix poetry.lock file via GitHub Actions"
        files: poetry.lock
        # Recommended: use a dedicated bot user or GITHUB_TOKEN with appropriate permissions
